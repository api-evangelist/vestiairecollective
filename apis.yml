description: Vestiaire Collective is a global online marketplace for pre-owned luxury and designer
  fashion, founded in Paris in 2009. The platform lets members buy and sell authenticated second-hand
  clothing, bags, shoes, watches, and accessories, with in-house physical authentication and quality
  control on higher-value items and a mission centered on circular fashion and sustainable consumption.
  It operates a consumer marketplace across web and mobile apps in dozens of countries. It is backed
  by Balderton Capital among other investors. This API Evangelist profile was added as a VC-portfolio
  lead; enrichment probes found no public developer/API program, but did verify the company's published
  security disclosure surface and domain-security posture.
